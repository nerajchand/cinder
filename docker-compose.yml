services:
  cinder:
    build: .
    image: cinder:local
    environment:
      CINDER_REDIS_URL: redis://redis:6379/0
      CINDER_ADDR: ":8080"
      # Behind a reverse proxy, also set (see docs/operations.md):
      # CINDER_TRUSTED_PROXIES: "172.16.0.0/12"
      # CINDER_ALLOWED_ORIGINS: "https://cinder.example.com"
    ports:
      # Plain HTTP on localhost only. Put a TLS reverse proxy in front for real use.
      # Override the host port with CINDER_HOST_PORT (default 8080).
      - "127.0.0.1:${CINDER_HOST_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # The distroless image has no shell, curl or wget: the binary probes itself.
    healthcheck:
      test: ["CMD", "/cinder", "healthcheck"]
      interval: 10s
      timeout: 4s
      start_period: 5s
      retries: 3

  redis:
    image: redis:7
    # The conf binds loopback only (right for bare metal), which would make Redis
    # unreachable from the cinder container. Inside this private compose network
    # (no published ports, no password) listen on all interfaces instead.
    command: ["redis-server", "/etc/redis/redis.conf", "--bind", "0.0.0.0", "--protected-mode", "no"]
    volumes:
      - ./deploy/redis.conf:/etc/redis/redis.conf:ro
    # Deliberately no data volume (secrets must not outlive the container) and no published ports.
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
