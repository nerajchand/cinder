services:
  cinder:
    build: .
    image: cinder:local
    environment:
      CINDER_REDIS_URL: redis://redis:6379/0
      CINDER_ADDR: ":8080"
      # Behind a reverse proxy, also set (see docs/operations.md):
      # CINDER_TRUSTED_PROXIES: "172.16.0.0/12"
      # CINDER_ALLOWED_ORIGINS: "https://cinder.example.com"
    ports:
      # Plain HTTP on localhost only. Put a TLS reverse proxy in front for real use.
      - "127.0.0.1:8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # No in-container healthcheck: the distroless image has no shell, curl or wget.
    # Probe GET /healthz from outside (proxy, orchestrator or monitoring).

  redis:
    image: redis:7
    command: ["redis-server", "/etc/redis/redis.conf"]
    volumes:
      - ./deploy/redis.conf:/etc/redis/redis.conf:ro
    # Deliberately no data volume (secrets must not outlive the container) and no published ports.
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
