# Cinder Redis configuration. Secrets are ephemeral ciphertext: never persist.
# Requires Redis >= 6.2.

# No persistence (RDB and AOF off).
save ""
appendonly no

# Bound memory; never evict (eviction could silently destroy secrets or
# tombstones). Writes fail with OOM instead, surfaced as 503.
maxmemory 256mb
maxmemory-policy noeviction

# Bind to loopback / private network only; set a password if exposed.
bind 127.0.0.1 -::1
protected-mode yes
