# Cinder Redis configuration. Secrets are ephemeral ciphertext: never persist.
# Requires Redis >= 6.2.

# No persistence (RDB and AOF off).
save ""
appendonly no

# Bound memory; never evict (eviction could silently destroy secrets or
# tombstones). Writes fail with OOM instead, surfaced as 503.
maxmemory 256mb
maxmemory-policy noeviction

# Listen on all container interfaces so the cinder container can connect over
# the private compose network. Redis is never published to the host (compose
# uses `expose`, not `ports`). Do NOT reuse this file on a host-reachable
# Redis: bind to a private interface and set `requirepass` instead.
bind * -::*
protected-mode no
